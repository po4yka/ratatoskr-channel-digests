[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
deny = [
  { name = "tikv-jemallocator" },
  { name = "jemallocator" },
  { name = "mimalloc" },
  { name = "snmalloc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/po4yka/ratatoskr-contracts"]
